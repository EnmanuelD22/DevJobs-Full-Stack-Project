<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Consulta los detalles de esta oportunidad laboral en DevJobs." />
    <title>Detalle del empleo | DevJobs</title>
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/detalle-empleo.css" />
    <script type="module" src="./js/detalle-empleo.js"></script>
</head>
<body>
    <header class="site-header">
        <a href="./index.html" class="brand" aria-label="DevJobs, página de inicio">
            <span class="brand-mark" aria-hidden="true">&lt;/&gt;</span>
            <span>DevJobs</span>
        </a>
        <nav aria-label="Navegación principal">
            <a href="./index.html">Inicio</a>
            <a href="./busqueda.html" aria-current="page">Empleos</a>
        </nav>
        <div class="auth-buttons"><a href="./busqueda.html" class="btn">Explorar empleos</a></div>
    </header>

    <main class="job-detail-page">
        <nav class="breadcrumbs" aria-label="Ruta de navegación">
            <a href="./busqueda.html">Empleos</a>
            <span aria-hidden="true">/</span>
            <span id="breadcrumb-title" aria-current="page">Detalle del empleo</span>
        </nav>
        <article id="job-detail" class="job-detail" aria-live="polite">
            <p class="loading-message">Cargando información del empleo…</p>
        </article>
        <section id="job-not-found" class="job-not-found" aria-labelledby="not-found-title" hidden>
            <span class="not-found-icon" aria-hidden="true">⌕</span>
            <h1 id="not-found-title">No encontramos este empleo</h1>
            <p>Es posible que la vacante ya no esté disponible.</p>
            <a class="detail-button" href="./busqueda.html">Explorar empleos</a>
        </section>
    </main>

    <footer class="site-footer"><p><small>&copy; 2026 DevJobs. Todos los derechos reservados.</small></p></footer>
</body>
</html>
